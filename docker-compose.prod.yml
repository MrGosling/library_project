# Compose для ПРОДАКШЕНА.
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
#
# Особенности prod-режима:
#   - код backend без монтирования томов;
#   - uvicorn без --reload, с несколькими воркерами;
#   - наружу открыт только gateway (порт 80); db и backend недоступны.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: library_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  db:
    image: postgres:16-alpine
    container_name: ${POSTGRES_HOST}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build: .
    container_name: library_backend
    env_file: .env
    environment:
      UVICORN_RELOAD: "false"
      UVICORN_WORKERS: "4"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: library_gateway
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres16_data:
  ollama_data:
